<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Своя Игра - Многопользовательская с сохранением состояния</title>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">
	<style>
		:root {
    --primary: #0b0f1a;
    --secondary: #1c2233;
    --accent: #ffcc00;
    --accent-hover: #ffe066;
    --used: #3a3f55;
    --text-light: #f8f8f8;
    --text-dark: #1a1a1a;
    --border-radius: 10px;
    --transition: 0.3s ease;
    --glow: 0 0 10px rgba(255, 204, 0, 0.6);
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top left, #0b0f1a, #121826);
    color: var(--text-light);
}

.container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

.board {
    display: flex;
    border-radius: var(--border-radius);
    flex-direction: column;
	margin: 10px;
}
.row {
	display: inline-flex;
}
.cell {
    background: var(--accent);
    color: var(--text-dark);
    font-weight: bold;
    font-size: 22px;
    text-align: center;
	align-content: center;
    padding: 15px;
    margin: 2px;    
	width: 50px;
    height: 50px;
    border-radius: var(--border-radius);
    box-shadow: var(--glow);
}

.cell:not(.header) {
    cursor: pointer;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
}

.cell:hover:not(.header) {
    background: var(--accent-hover);
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255, 255, 150, 0.8);
}

.cell.used {
    background: var(--used);
    color: #aaa;
    cursor: default;
    box-shadow: none;
}

.cell.header {
    background: white;
	width: 260px;
}

.leaderboard {
    background: var(--secondary);
    padding: 24px;
    border-radius: var(--border-radius);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    margin: 10px;
    min-width: 200px;
	max-width: 300px;
}

.leaderboard h1,
.leaderboard h2 {
    margin: 0 0 12px;
    color: var(--accent);
    text-shadow: 0 0 5px rgba(255, 204, 0, 0.5);
}

.leaderboard .leaderboard__btn {
	display: flex;
    flex-wrap: nowrap;
    flex-direction: column;
}

.player {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: #2b324a;
    border-radius: var(--border-radius);
    margin-bottom: 10px;
}

button {
    background: var(--accent);
    color: var(--text-dark);
    border: none;
    padding: 12px 24px;
	margin: 3px;
    border-radius: var(--border-radius);
    cursor: pointer;
    font-weight: bold;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    box-shadow: var(--glow);
}

button:hover {
    background: var(--accent-hover);
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255, 255, 150, 0.8);
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background: rgba(10, 10, 20, 0.85);
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
    box-sizing: border-box;
}

.modal.open {
    display: flex;
}

.modal-content {
    background: var(--secondary);
    padding: 30px;
    border-radius: var(--border-radius);
    width: 100%;
    max-width: 70vw;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}

/* Стили для адаптивного видео-контейнера */
.video-container {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* Соотношение сторон 16:9 */
    height: 0;
    margin: 15px 0;
    border-radius: var(--border-radius);
    overflow: hidden;
    display: none; 
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

/* Стили для адаптивного контейнера картинок */
.image-container {
    width: 100%;
    text-align: center;
    margin: 15px 0;
    display: none;
}

.image-container img {
    max-width: 100%;
    max-height: 400px; /* Чтобы слишком высокие вертикальные картинки не растягивали экран */
    object-fit: contain;
    border-radius: var(--border-radius);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

/* Мобильная адаптация */
@media (max-width: 768px) {
	
	.board {
		display: block;
		overflow-x: auto;
	}
	.leaderboard {
		max-width: none;
		width: 100%;
	}

    .modal-content {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        border-radius: 0;
        padding: 20px;
    }
    .close {
        font-size: 56px;
        top: 15px;
        right: 20px;
    }
}

.close {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 48px; 
    cursor: pointer;
    color: var(--accent);
    line-height: 1;
    transition: transform 0.2s ease;
}

.close:hover {
    transform: scale(1.2);
}

.questionText {
    font-size: 20px;
    margin: 20px 0;
}

.correctAnswer {
    color: #00ff99;
    font-size: 22px;
    font-weight: bold;
	display:none; 
	font-weight:bold; 
	margin:10px 0;
}

#modalControls {
    margin-top: 20px;
}

#modalControls button {
    margin-top: 10px;
}

.player-controls {
    display: flex;
    justify-content: flex-end;
    align-items: center;
}
.player-controls span {
    font-size: 26px;
}
.player-controls div button {
    margin-left: 10px;
}

/* BACKGROUND START */
.animated-background {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    background: radial-gradient(circle at 20% 30%, rgb(44, 44, 44), transparent 60%),
                radial-gradient(circle at 80% 70%, rgb(138, 124, 44), transparent 60%),
                linear-gradient(120deg, #1e1e2f, #2a2a3f);
    background-size: 200% 200%;
    animation: backgroundFlow 20s ease infinite;
    pointer-events: none;
}
@keyframes backgroundFlow {
	0% { background-position: 0% 0%; }
	50% { background-position: 100% 100%; }
	100% { background-position: 0% 0%; }
}
body {
	margin: 0;
	font-family: 'Segoe UI', sans-serif;
	transition: background 0.5s ease;
}
/* BACKGROUND END */

	</style>

</head>

						{ value: 400, question: "Кто возглавлял СССР во время Второй мировой войны?", answer: "Сталин" },
						{ value: 500, question: "Какой договор завершил Первую мировую войну?", answer: "Версальский договор" }
					]
				},

		let currentRound = localStorage.getItem("currentRound") || 0;

		if (!roundQuestion[currentRound]) {
			currentRound = 0;
		}

		document.querySelector('.roundText').innerHTML = 'Round ' + (Number(currentRound) + 1);

		const categories = roundQuestion[currentRound];
		const modalControls = document.getElementById("modalControls");

		let players = JSON.parse(localStorage.getItem("players")) || [];
		let usedQuestions = JSON.parse(localStorage.getItem("usedQuestions")) || {};

		let currentQuestion = null;
		let currentCategoryIndex = null;
		let currentQuestionIndex = null;

		function getYouTubeId(url) {
			if (!url) return null;
			if (url.length === 11 && !url.includes('/') && !url.includes('?')) return url;
			const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
			const match = url.match(regExp);
			return (match && match[2].length === 11) ? match[2] : null;
		}

		function savePlayers() {
			localStorage.setItem("players", JSON.stringify(players));
		}

		function saveUsedQuestions() {
			localStorage.setItem("usedQuestions", JSON.stringify(usedQuestions));
		}

		function initBoard() {
			const board = document.getElementById("gameBoard");
			board.innerHTML = "";
			categories.forEach((cat, catIndex) => {
				const row = document.createElement('div');
				row.className = 'row';

				const headerCell = document.createElement('div');
				headerCell.className = 'cell header';
				headerCell.textContent = cat.title;
				row.appendChild(headerCell);

				cat.questions.forEach((q, qIndex) => {
					const qId = currentRound + "-" + catIndex + "-" + qIndex;
					const cell = document.createElement('div');
					cell.className = 'cell';
					cell.textContent = q.value;

					if (usedQuestions[qId]) {
						cell.classList.add("used");
					}
					cell.onclick = function () { openQuestion(catIndex, qIndex, cell); };
					row.appendChild(cell);
				});
				board.appendChild(row);
			});
		}

		function openQuestion(catIndex, qIndex, cellElem) {
			currentCategoryIndex = catIndex;
			currentQuestionIndex = qIndex;
			currentQuestion = categories[catIndex].questions[qIndex];

			const correctAnswerEl = document.querySelector(".correctAnswer");
			correctAnswerEl.style.display = "none";
			correctAnswerEl.textContent = "";
			document.getElementById("showAnswerBtn").disabled = false;

			document.getElementById("questionTitle").textContent = categories[catIndex].title + " " + currentQuestion.value + " очков";
			document.querySelector(".questionText").textContent = currentQuestion.question;

			// 1. Обработка видео YouTube
			// 1. Обработка видео YouTube с автоматическим зацикливанием отрывка
			const videoContainer = document.getElementById("videoContainer");
			const videoId = getYouTubeId(currentQuestion.youtube);

			if (videoId) {
				// Создаем пустой элемент-контейнер для плеера
				videoContainer.innerHTML = '<div id="yt-player"></div>';
				videoContainer.style.display = "block";

				// Инициализируем плеер через YouTube API
				new YT.Player('yt-player', {
					height: '100%',
					width: '100%',
					videoId: videoId,
					playerVars: {
						'autoplay': 1,
						'controls': 0,      // Скрываем управление
						'rel': 0,
						'showinfo': 0,
						'fs': 0,            // Отключаем кнопку во весь экран
						'start': currentQuestion.start || 0,
						'end': currentQuestion.end || undefined
					},
					events: {
						'onStateChange': function(event) {
							// Состояние 0 означает, что видео закончилось (дойдя до параметра end)
							if (event.data === YT.PlayerState.ENDED) {
								// Перематываем на начало отрывка и запускаем снова
								event.target.seekTo(currentQuestion.start || 0);
								event.target.playVideo();
							}
						}
					}
				});
			} else {
				videoContainer.innerHTML = "";
				videoContainer.style.display = "none";
			}

			// 2. Обработка картинок / фотографий
			const imageContainer = document.getElementById("imageContainer");
			if (currentQuestion.image) {
				imageContainer.innerHTML = `<img src="${currentQuestion.image}" alt="Изображение к вопросу">`;
				imageContainer.style.display = "block";
			} else {
				imageContainer.innerHTML = "";
				imageContainer.style.display = "none";
			}

			const qId = `${currentRound}-${catIndex}-${qIndex}`;
			renderPlayerControls(qId);
			saveUsedQuestions();
		
			cellElem.classList.add("used");
			document.getElementById("questionModal").classList.add('open');
		}

		function renderPlayerControls(qId) {
			let isUsed = false;
			modalControls.innerHTML = "";

			if(typeof usedQuestions[qId] === 'undefined') {
				usedQuestions[qId] = {};
			} else {
				isUsed = true;
			}

				const container = document.createElement("div");
				container.classList.add('player-controls');

				const spanName = document.createElement("span");
				spanName.textContent = player.name;
				container.appendChild(spanName);

				const spanScore = document.createElement("span");
				spanScore.style.margin = "0 10px";
				spanScore.textContent = player.score;
				container.appendChild(spanScore);

				const btnContainer = document.createElement("div");
				const btnCorrect = document.createElement("button");
				btnCorrect.textContent = "Правильно";
				btnCorrect.style.marginLeft = "10px";
				btnCorrect.onclick = function () {
					if (typeof usedQuestions[qId][player.id] === 'undefined') {
						updateScore(player.id, currentQuestion.value);
						spanScore.textContent = Number(spanScore.textContent) + Number(currentQuestion.value);
						spanScore.style.color = "green";
						
						usedQuestions[qId][player.id] = true;
						saveUsedQuestions();
						btnCorrect.disabled = true;
						btnWrong.disabled = true;
						btnCorrect.style.opacity = 0.5;
						btnWrong.style.opacity = 0.1;

						let unUsedBtnList = document.querySelectorAll('.player-controls button:not([disabled])');
						unUsedBtnList.forEach(btn => {
							btn.disabled = true;
							btn.style.opacity = 0.1;
						});
					}
				};

				const btnWrong = document.createElement("button");
				btnWrong.textContent = "Неправильно";
				btnWrong.style.marginLeft = "10px";
				btnWrong.onclick = function () {
					if (typeof usedQuestions[qId][player.id] === 'undefined') {
						updateScore(player.id, -currentQuestion.value);
						spanScore.textContent = Number(spanScore.textContent) - Number(currentQuestion.value);
						spanScore.style.color = "red";

						usedQuestions[qId][player.id] = false;
						saveUsedQuestions();
						btnCorrect.disabled = true;
						btnWrong.disabled = true;
						btnCorrect.style.opacity = 0.1;
						btnWrong.style.opacity = 0.5;
					}
				};

				if (isUsed) {
					spanScore.remove();
					btnCorrect.disabled = true;
					btnWrong.disabled = true;
					if(typeof usedQuestions[qId][player.id] === 'undefined') {
						btnCorrect.style.opacity = 0.1;
						btnWrong.style.opacity = 0.1;
					} else if(usedQuestions[qId][player.id]) {
						btnCorrect.style.opacity = 0.5;
						btnWrong.style.opacity = 0.1;
					} else {
						btnCorrect.style.opacity = 0.1;
						btnWrong.style.opacity = 0.5;
					}
				}

				btnContainer.appendChild(btnCorrect);
				btnContainer.appendChild(btnWrong);
				container.appendChild(btnContainer);
				modalControls.appendChild(container);
			});

			const closeBtn = document.createElement("button");
			closeBtn.textContent = "Закрыть вопрос";
			closeBtn.style.marginTop = "20px";
			closeBtn.style.padding = "10px 20px";
			closeBtn.onclick = function () { closeModal(); };
			modalControls.appendChild(closeBtn);
		}

		function showAnswer() {
			const correctAnswerEl = document.querySelector(".correctAnswer");
			correctAnswerEl.textContent = "Ответ: " + currentQuestion.answer;
			correctAnswerEl.style.display = "block";
			document.getElementById("showAnswerBtn").disabled = true;
		}

		function closeModal() {
			document.getElementById("videoContainer").innerHTML = "";
			document.getElementById("imageContainer").innerHTML = ""; // Очищаем картинку при закрытии
			document.getElementById("questionModal").classList.remove('open');
		}

		function addPlayer() {
			let name = prompt("Введите имя игрока:");
			if (name) {
				players.push({id: players.length+1,name: name, score: 0 });
				savePlayers();
				renderLeaderboard();
			}
		}

		function updateScore(playerId, points, fullUpdate) {
			const playerIndex = players.findIndex(item => item.id === playerId);
			if(fullUpdate) {
				players[playerIndex].score = Number(points);
			} else {
				players[playerIndex].score += Number(points);
			}
			savePlayers();
			renderLeaderboard();
		}

		function resetGame() {
			let reset = confirm("Сбросить игру?");
			if (reset) {
				localStorage.clear();
				window.location.reload();
			}
		}

		function nextRound() {
			localStorage.setItem("currentRound", (roundQuestion.length <= currentRound) ? 0 : Number(currentRound) + 1);
			window.location.reload();
		}

		function renderLeaderboard() {
			const list = document.getElementById("playersList");
			list.innerHTML = "";
			let sortPlayers = players.toSorted((a, b) => b.score - a.score);
			sortPlayers.forEach((player, index) => {
				const div = document.createElement("div");
				div.className = "player";
				
				const scoreSpan = document.createElement("span");
				scoreSpan.textContent = player.score;
				scoreSpan.style.cursor = "pointer";
				scoreSpan.onclick = function() { showEditField(player, scoreSpan); };

				div.innerHTML = `<span>${player.name}</span>`;
				div.appendChild(scoreSpan);
				list.appendChild(div);
			});
		}

		function showEditField(player, scoreSpan) {
			const input = document.createElement("input");
			input.type = "number";
			input.value = player.score;
			input.style.width = "90px";
			input.onblur = function() { updateScore(player.id, input.value, true); };
			input.onkeydown = function(event) {
				if (event.key === "Enter") {
					updateScore(player.id, input.value, true);
				}
			};
			scoreSpan.replaceWith(input);
			input.focus();
		}

		window.onload = function () {
			initBoard();
			renderLeaderboard();
		}
	</script>
</body>
</html>
