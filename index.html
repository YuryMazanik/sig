<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Своя Игра - Многопользовательская с сохранением состояния</title>
	<script src="jszip.min.js"></script>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Righteous&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-bg: #060913;
        --secondary-bg: #12182b;
        --card-bg: #1a2238;
        --accent-gold: linear-gradient(180deg, #ffe066 0%, #d49a00 100%);
        --accent-gold-hover: linear-gradient(180deg, #fff0aa 0%, #ffbb00 100%);
        --used-bg: #151926;
        --text-light: #ffffff;
        --border-radius: 12px;
        --neon-glow: 0 0 20px rgba(255, 204, 0, 0.4);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        background: radial-gradient(circle at 50% 20%, #1a2542 0%, #060913 80%);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        color: var(--text-light);
        min-height: 100vh;
    }

    .container {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
        gap: 20px;
        flex-wrap: wrap;
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
    }

    /* Контейнер игровой доски с адаптивным скроллом */
    .board-wrapper {
        flex: 1;
        overflow-x: auto;
        display: flex;
        justify-content: center;
        min-width: 0;
        padding-bottom: 10px;
    }

    .board {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(18, 24, 43, 0.85);
        padding: 15px;
        border-radius: 16px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 2px rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        min-width: max-content;
    }

    .row {
        display: flex;
        gap: 8px;
    }

    .cell {
        background: var(--accent-gold);
        color: #0b0f1a;
        font-family: 'Righteous', sans-serif;
        font-size: clamp(18px, 2vw, 26px);
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(55px, 5vw, 70px);
        height: clamp(50px, 4.5vw, 65px);
        border-radius: 8px;
        box-shadow: 0 5px 0 #996f00, 0 8px 15px rgba(0,0,0,0.4);
        transition: all 0.15s ease;
        text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        flex-shrink: 0;
    }

    .cell:not(.header) {
        cursor: pointer;
    }

    .cell:hover:not(.header) {
        background: var(--accent-gold-hover);
        transform: translateY(-3px);
        box-shadow: 0 8px 0 #996f00, var(--neon-glow);
    }

    .cell:active:not(.header) {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #996f00;
    }

    .cell.used {
        background: var(--used-bg);
        color: #3b4461;
        box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
        cursor: default;
        text-shadow: none;
    }

    .cell.header {
        background: linear-gradient(180deg, #ffffff 0%, #c8d3f5 100%);
        width: clamp(180px, 20vw, 280px);
        font-family: 'Montserrat', sans-serif;
        font-size: clamp(13px, 1.3vw, 17px);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 5px 0 #8493c4, 0 8px 15px rgba(0,0,0,0.3);
        justify-content: flex-start;
        padding-left: 15px;
        padding-right: 15px;
        color: #0d1322;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Боковая панель управления и лидеров */
    .leaderboard {
        background: rgba(18, 24, 43, 0.85);
        padding: 24px;
        border-radius: 16px;
        width: 100%;
        max-width: 340px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 2px rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
    }

    .leaderboard h1 {
        font-family: 'Righteous', cursive;
        margin: 0 0 5px;
        color: #ffcc00;
        font-size: 28px;
        text-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
        text-align: center;
    }

    .leaderboard h2 {
        font-size: 18px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #8fa0d0;
        margin: 0 0 15px;
        text-align: center;
    }

    .leaderboard__btn {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .player {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: linear-gradient(90deg, #1e2947 0%, #151d33 100%);
        border-radius: 10px;
        margin-bottom: 10px;
        font-size: 18px;
        font-weight: 700;
        border-left: 4px solid #ffcc00;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .player span:last-child {
        font-family: 'Righteous', monospace;
        color: #ffcc00;
        font-size: 22px;
    }

    button, .file-upload-btn {
        background: var(--accent-gold);
        color: #0b0f1a;
        font-family: 'Montserrat', sans-serif;
        font-weight: 900;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border: none;
        padding: 12px 18px;
        margin: 0;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px 0 #996f00, 0 6px 12px rgba(0,0,0,0.3);
        transition: all 0.1s ease;
        text-align: center;
        width: 100%;
    }

    button:hover, .file-upload-btn:hover {
        background: var(--accent-gold-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 0 #996f00, 0 0 15px rgba(255,204,0,0.4);
    }

    button:active, .file-upload-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #996f00;
    }

    .btn-reset {
        background: linear-gradient(180deg, #ff4d4d 0%, #b30000 100%) !important;
        color: white !important;
        box-shadow: 0 4px 0 #800000 !important;
    }
    .btn-reset:hover {
        box-shadow: 0 6px 0 #800000, 0 0 15px rgba(255, 77, 77, 0.4) !important;
    }

    /* Модальные окна */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: rgba(6, 9, 19, 0.85);
        backdrop-filter: blur(8px);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 15px;
        box-sizing: border-box;
    }

    .modal.open {
        display: flex;
    }

    .modal-content {
        background: radial-gradient(circle at center, #1b2645 0%, #0f1526 100%);
        padding: clamp(20px, 3vw, 35px);
        border-radius: 20px;
        border: 2px solid rgba(255, 204, 0, 0.3);
        box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(255,204,0,0.2);
        width: 100%;
        max-width: 800px;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
        animation: modalScale 0.25s ease-out;
    }

    @keyframes modalScale {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .questionText {
        font-size: clamp(16px, 2vw, 22px);
        line-height: 1.5;
        font-weight: 700;
        color: #e2e9ff;
        background: rgba(0,0,0,0.2);
        padding: 15px;
        border-radius: 12px;
        border-left: 4px solid #ffcc00;
        margin: 15px 0;
        word-break: break-word;
    }

	.image-container img {
		max-width: 100%;
		max-height: 40vh;
		object-fit: contain;
		border-radius: 14px;
		box-shadow: 0 12px 30px rgba(0,0,0,0.7);
		border: 2px solid rgba(255, 255, 255, 0.1);
	}

    .correctAnswer {
        color: #00ffaa;
        font-size: clamp(18px, 2.2vw, 24px);
        font-weight: 900;
        text-shadow: 0 0 12px rgba(0, 255, 170, 0.4);
        background: rgba(0, 255, 170, 0.1);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(0, 255, 170, 0.3);
        margin: 15px 0;
        word-break: break-word;
    }

    .player-controls {
        background: rgba(255,255,255,0.03);
        padding: 10px 15px;
        border-radius: 10px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }
    
    .player-controls span {
        font-size: 18px;
        font-weight: 700;
    }

    .player-controls div {
        display: flex;
        gap: 8px;
    }

    .player-controls button {
        width: auto;
        padding: 8px 14px;
        font-size: 12px;
    }

    .close {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 36px;
        cursor: pointer;
        color: #ffcc00;
        line-height: 1;
        transition: transform 0.2s;
    }

    .close:hover {
        transform: scale(1.2);
    }

    /* 📱 Мобильная адаптация для главного экрана */
    @media (max-width: 900px) {
        .container {
            flex-direction: column;
            padding: 10px;
            gap: 15px;
        }

        .leaderboard {
            max-width: none;
            width: 100%;
        }

        .board-wrapper {
            width: 100%;
            justify-content: flex-start;
        }
    }
</style>
	<script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
	<div class="container">
		<div class="board-wrapper">
			<div class="board" id="gameBoard"></div>
		</div>
		<div class="leaderboard" id="leaderboard">
			<h1 class="roundText"></h1>
			<h2>Лучшие</h2>
			<div id="playersList"></div>
			<div class="leaderboard__btn">
				<button onclick="addPlayer()">Добавить игрока</button>
				<button onclick="nextRound()">Следующий раунд</button>
				<button onclick="openSettingsModal()" style="background: #2b324a; color: #ffcc00; border: 2px solid #ffcc00;">⚙️ Настройки</button>
			</div>
		</div>
	</div>

	<!-- Модальное окно Настройки -->
	<div id="settingsModal" class="modal">
		<div class="modal-content" style="max-width: 450px; text-align: center;">
			<span class="close" onclick="closeSettingsModal()">&times;</span>
			<h2 style="font-family: 'Righteous', cursive; color: #ffcc00; margin-top: 0;">НАСТРОЙКИ</h2>
			<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
				<button onclick="openDisplayWindow()" style="background: #00ff99; color: #0b0f1a;">🖥️ Открыть экран для ТВ</button>
				
				<label class="file-upload-btn" style="width: 100%; margin: 0;">
					📁 Загрузить игру SIQ
					<input type="file" id="xmlFileInput" accept=".siq" style="display: none;" onchange="loadXmlPackage(event); closeSettingsModal();">
				</label>

				<button onclick="setCustomBackground()" style="background: #3a4b7c; color: #fff;">🖼️ Ссылка на задний фон</button>

				<button class="btn-reset" onclick="resetGame()">⚠️ Сбросить игру</button>
			</div>
		</div>
	</div>

	<div id="questionModal" class="modal">
		<div class="modal-content">
			<span class="close" onclick="closeModal()">&times;</span>
			<h2 id="questionTitle">Вопрос</h2>
			
			<div class="video-container" id="videoContainer"></div>
			<div class="image-container" id="imageContainer"></div>

			<p class="questionText">Текст вопроса</p>
			<button id="showAnswerBtn" onclick="showAnswer()">Показать ответ</button>
			<p class="correctAnswer"></p>
			<div id="modalControls"></div>
		</div>
	</div>

	<script>
		let defaultQuestions = [
			[
				{
					title: "История",
					questions: [
						{ value: 100, question: "Кто был первым князем Древней Руси?", answer: "Рюрик" },
						{ value: 200, question: "В каком году произошла Октябрьская революция?", answer: "1917" }
					]
				}
			]
		];

		let roundQuestion = defaultQuestions;
		let localImageFiles = {};
		let categories = [];

		let currentRound = Number(localStorage.getItem("currentRound")) || 0;
		let players = JSON.parse(localStorage.getItem("players")) || [];
		let usedQuestions = JSON.parse(localStorage.getItem("usedQuestions")) || {};

		const modalControls = document.getElementById("modalControls");
		let currentQuestion = null;
		let currentCategoryIndex = null;
		let currentQuestionIndex = null;

		// Канал связи для второго экрана (телевизора)
		const gameChannel = new BroadcastChannel('svoya_igra_channel');
		let isTvConnected = false;

		function openDisplayWindow() {
			window.open('display.html', '_blank', 'width=1280,height=720');
		}

		// Управление модальным окном настроек
		function openSettingsModal() {
			document.getElementById("settingsModal").classList.add('open');
		}

		function closeSettingsModal() {
			document.getElementById("settingsModal").classList.remove('open');
		}

		// Функция установки фона через confirm/prompt
		function setCustomBackground() {
			let bgUrl = prompt("Введите URL (ссылку) на картинку для заднего фона:", localStorage.getItem("customBgUrl") || "");
			if (bgUrl !== null) {
				if (bgUrl.trim() !== "") {
					localStorage.setItem("customBgUrl", bgUrl.trim());
					document.body.style.backgroundImage = `url('${bgUrl.trim()}')`;
				} else {
					localStorage.removeItem("customBgUrl");
					document.body.style.backgroundImage = "none";
				}
				syncTVBoard();
			}
			
		}

		// Слушаем сообщения от ТВ-экрана
		gameChannel.onmessage = function(event) {
			const data = event.data;
			if (data.action === 'tvConnected') {
				isTvConnected = true;
				syncTVBoard();
			} else if (data.action === 'requestSync') {
				isTvConnected = true;
				syncTVBoard();
			}
		};

		function syncTVBoard() {
			if(isTvConnected) {
				gameChannel.postMessage({
					action: 'initBoard',
					round: currentRound,
					categories: categories,
					used: usedQuestions,
					players: players
				});
			}
		}

		// Инициализация IndexedDB для хранения пакетов
		let db;
		const dbRequest = indexedDB.open("SvoyaIgraDB", 1);

		dbRequest.onerror = function(event) {
			console.error("Ошибка открытия IndexedDB", event);
			initDefaultGame();
		};

		dbRequest.onsuccess = function(event) {
			db = event.target.result;
			loadDataFromDB();
		};

		dbRequest.onupgradeneeded = function(event) {
			db = event.target.result;
			if (!db.objectStoreNames.contains("gameData")) {
				db.createObjectStore("gameData");
			}
		};

		function saveDataToDB(key, data, callback) {
			if (!db) return;
			const transaction = db.transaction(["gameData"], "readwrite");
			const store = transaction.objectStore("gameData");
			store.put(data, key);
			transaction.oncomplete = function() {
				if (callback) callback();
			};
		}

		function loadDataFromDB() {
			if (!db) {
				initDefaultGame();
				return;
			}
			const transaction = db.transaction(["gameData"], "readonly");
			const store = transaction.objectStore("gameData");
			
			const reqQuestions = store.get("roundQuestion");
			reqQuestions.onsuccess = function() {
				if (reqQuestions.result) {
					roundQuestion = reqQuestions.result;
				} else {
					roundQuestion = defaultQuestions;
				}
				
				if (!roundQuestion[currentRound]) {
					currentRound = 0;
					localStorage.setItem("currentRound", 0);
				}

				categories = roundQuestion[currentRound];
				initBoard();
				document.querySelector('.roundText').innerHTML = 'Раунд ' + (currentRound + 1);
			};

			reqQuestions.onerror = function() {
				initDefaultGame();
			};

			const reqImages = store.get("localImages");
			reqImages.onsuccess = function() {
				if (reqImages.result) {
					localImageFiles = reqImages.result;
				}
			};
		}

		function initDefaultGame() {
			roundQuestion = defaultQuestions;
			if (!roundQuestion[currentRound]) {
				currentRound = 0;
				localStorage.setItem("currentRound", 0);
			}
			categories = roundQuestion[currentRound];
			initBoard();
			document.querySelector('.roundText').innerHTML = 'Round ' + (currentRound + 1);
		}

		function getYouTubeId(url) {
			if (!url) return null;
			if (url.length === 11 && !url.includes('/') && !url.includes('?')) return url;
			const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
			const match = url.match(regExp);
			return (match && match[2].length === 11) ? match[2] : null;
		}

		function savePlayers() {
			localStorage.setItem("players", JSON.stringify(players));
		}

		function saveUsedQuestions() {
			localStorage.setItem("usedQuestions", JSON.stringify(usedQuestions));
		}

		function loadXmlPackage(event) {
			const file = event.target.files[0];
			if (!file) return;

			if (file.name.endsWith('.siq') || file.name.endsWith('.zip') || file.type === 'application/zip' || file.type === 'application/x-zip-compressed') {
				const reader = new FileReader();
				reader.onload = function(e) {
					JSZip.loadAsync(e.target.result).then(async function(zip) {
						let xmlFile = null;
						let tempImages = {};

						let xmlEntry = null;
						let imageEntries = [];

						zip.forEach(function (relativePath, zipEntry) {
							const lowerPath = relativePath.toLowerCase();
							if (lowerPath.endsWith('content.xml')) {
								xmlEntry = zipEntry;
							} else if (lowerPath.includes('images/') && !zipEntry.dir) {
								imageEntries.push({ path: relativePath, entry: zipEntry });
							}
						});

						if (!xmlEntry) {
							alert("В архиве .siq не найден файл content.xml!");
							return;
						}

						for (let imgObj of imageEntries) {
							try {
								const contentBlob = await imgObj.entry.async("blob");
								const base64Data = await new Promise((resolve) => {
									const r = new FileReader();
									r.onload = function(ev) { resolve(ev.target.result); };
									r.readAsDataURL(contentBlob);
								});

								let fileNameOnly = imgObj.path.split('/').pop().toLowerCase();
								tempImages[fileNameOnly] = base64Data;
								tempImages[imgObj.path.toLowerCase()] = base64Data;
							} catch (err) {
								console.error("Ошибка чтения картинки из архива:", imgObj.path);
							}
						}

						localImageFiles = tempImages;
						saveDataToDB("localImages", localImageFiles);

						const xmlText = await xmlEntry.async("text");
						parseAndSaveXmlContent(xmlText);

					}).catch(function(err) {
						console.error(err);
						alert("Ошибка при распаковке .siq архива. Убедитесь, что это корректный файл.");
					});
				};
				reader.readAsArrayBuffer(file);
			} else {
				alert("Пожалуйста, выберите файл пакета в формате .siq");
			}
		}

		function parseAndSaveXmlContent(xmlText) {
			try {
				const parser = new DOMParser();
				const xmlDoc = parser.parseFromString(xmlText, "text/xml");

				const parseError = xmlDoc.querySelector("parsererror");
				if (parseError) {
					alert("Ошибка при разборе XML файла!");
					return;
				}

				const parsedRounds = [];
				const rounds = xmlDoc.querySelectorAll("rounds > round");

				rounds.forEach((roundNode) => {
					const roundCategories = [];
					const themes = roundNode.querySelectorAll("themes > theme");

					themes.forEach((themeNode) => {
						const themeName = themeNode.getAttribute("name") || "Без названия";
						const questionsList = [];
						const xmlQuestions = themeNode.querySelectorAll("questions > question");

						xmlQuestions.forEach((qNode, qIdx) => {
							const priceAttr = qNode.getAttribute("price");
							let value = priceAttr ? parseInt(priceAttr, 10) : (qIdx + 1) * 100;

							let qText = "";
							let aText = "";
							let imgLink = "";
							let ansImgLink = "";
							let ytLink = "";

							const atoms = qNode.querySelectorAll("scenario > atom");
							atoms.forEach(atom => {
								let text = atom.textContent.trim();
								const type = atom.getAttribute("type");
								let fileNameOnly = text.split('/').pop().split('\\').pop().replace(/^#|#$/g, '').toLowerCase();

								if (!type || type === "text") {
									if (text.startsWith("http://") || text.startsWith("https://")) {
										if (text.match(/\.(jpeg|jpg|gif|png)$/i)) imgLink = text;
									} else if (localImageFiles[fileNameOnly]) {
										imgLink = localImageFiles[fileNameOnly];
									} else {
										qText += (qText ? " " : "") + text;
									}
								} else if (type === "image") {
									imgLink = localImageFiles[fileNameOnly] || text;
								} else if (type === "video" && !ytLink) {
									ytLink = text;
								}
							});

							const params = qNode.querySelectorAll("params > param");
							params.forEach(param => {
								const paramName = param.getAttribute("name");
								const items = param.querySelectorAll("item");

								items.forEach(item => {
									let text = item.textContent.trim();
									let isRef = item.getAttribute("isRef") === "True";
									let itemType = item.getAttribute("type");
									let fileNameOnly = text.split('/').pop().split('\\').pop().toLowerCase();

									if (paramName === "question") {
										if (itemType === "image" || isRef || text.match(/\.(jpeg|jpg|gif|png)$/i)) {
											imgLink = localImageFiles[fileNameOnly] || text;
										} else if (itemType === "text" || !itemType) {
											qText += (qText ? " " : "") + text;
										}
									} else if (paramName === "answer") {
										if (itemType === "image" || isRef || text.match(/\.(jpeg|jpg|gif|png)$/i)) {
											ansImgLink = localImageFiles[fileNameOnly] || text;
										}
									}
								});
							});

							if (!qText) qText = "Вопрос на картинке";

							const rights = qNode.querySelectorAll("right > answer");
							let answersArr = [];
							rights.forEach(ans => {
								let ansText = ans.textContent.trim();
								if (ansText) answersArr.push(ansText);
							});
							
							aText = answersArr.length > 0 ? answersArr.join(", ") : "";
							if (ansImgLink) {
								aText += (aText ? "<br>" : "") + '<img src="' + ansImgLink + '" style="max-width:100%; max-height:300px; border-radius:8px; margin-top:10px;" alt="Картинка к ответу">';
							}
							if (!aText) aText = "Ответ не указан";

							questionsList.push({
								value: value,
								question: qText,
								answer: aText,
								image: imgLink || undefined,
								youtube: ytLink || undefined
							});
						});

						if (questionsList.length > 0) {
							roundCategories.push({
								title: themeName,
								questions: questionsList
							});
						}
					});

					if (roundCategories.length > 0) {
						parsedRounds.push(roundCategories);
					}
				});

				if (parsedRounds.length > 0) {
					roundQuestion = parsedRounds;
					currentRound = 0;
					localStorage.setItem("currentRound", 0);
					localStorage.removeItem("usedQuestions");
					usedQuestions = {};
					categories = roundQuestion[currentRound];
					
					saveDataToDB("roundQuestion", roundQuestion, function() {
						initBoard();
						document.querySelector('.roundText').innerHTML = 'Round ' + (currentRound + 1);
						alert("Пакет .siq успешно загружен и сохранен!");
					});
				} else {
					alert("Не удалось извлечь вопросы из структуры XML.");
				}

			} catch (err) {
				console.error(err);
				alert("Ошибка при разборе файла content.xml.");
			}
		}

		function initBoard() {
			const board = document.getElementById("gameBoard");
			board.innerHTML = "";
			if (!categories || !categories.forEach) return;
			categories.forEach((cat, catIndex) => {
				const row = document.createElement('div');
				row.className = 'row';

				const headerCell = document.createElement('div');
				headerCell.className = 'cell header';
				headerCell.textContent = cat.title;
				row.appendChild(headerCell);

				cat.questions.forEach((q, qIndex) => {
					const qId = currentRound + "-" + catIndex + "-" + qIndex;
					const cell = document.createElement('div');
					cell.className = 'cell';
					cell.textContent = q.value;

					if (usedQuestions[qId]) {
						cell.classList.add("used");
					}
					cell.onclick = function () { openQuestion(catIndex, qIndex, cell); };
					row.appendChild(cell);
				});
				board.appendChild(row);
			});

			syncTVBoard();
		}

		function openQuestion(catIndex, qIndex, cellElem) {
			currentCategoryIndex = catIndex;
			currentQuestionIndex = qIndex;
			currentQuestion = categories[catIndex].questions[qIndex];

			const correctAnswerEl = document.querySelector(".correctAnswer");
			
			if (isTvConnected) {
				correctAnswerEl.innerHTML = "Ответ: " + currentQuestion.answer;
				correctAnswerEl.style.display = "block";
			} else {
				correctAnswerEl.style.display = "none";
				correctAnswerEl.textContent = "";
				document.getElementById("showAnswerBtn").disabled = false;
			}

			document.getElementById("questionTitle").textContent = categories[catIndex].title + " " + currentQuestion.value + " очков";
			document.querySelector(".questionText").textContent = currentQuestion.question;

			const videoContainer = document.getElementById("videoContainer");
			const videoId = getYouTubeId(currentQuestion.youtube);

			if (videoId) {
				videoContainer.innerHTML = '<div id="yt-player"></div>';
				videoContainer.style.display = "block";
				new YT.Player('yt-player', {
					height: '100%',
					width: '100%',
					videoId: videoId,
					playerVars: {
						'autoplay': 1,
						'controls': 0,
						'rel': 0,
						'fs': 0,
						'start': currentQuestion.start || 0,
						'end': currentQuestion.end || undefined
					},
					events: {
						'onStateChange': function(event) {
							if (event.data === YT.PlayerState.ENDED) {
								event.target.seekTo(currentQuestion.start || 0);
								event.target.playVideo();
							}
						}
					}
				});
			} else {
				videoContainer.innerHTML = "";
				videoContainer.style.display = "none";
			}

			const imageContainer = document.getElementById("imageContainer");
			if (currentQuestion.image) {
				imageContainer.innerHTML = '<img src="' + currentQuestion.image + '" alt="Изображение к вопросу">';
				imageContainer.style.display = "block";
			} else {
				imageContainer.innerHTML = "";
				imageContainer.style.display = "none";
			}

			const qId = currentRound + "-" + catIndex + "-" + qIndex;
			renderPlayerControls(qId);
			saveUsedQuestions();
		
			cellElem.classList.add("used");
			document.getElementById("questionModal").classList.add('open');

			gameChannel.postMessage({
				action: 'showQuestion',
				title: categories[catIndex].title,
				value: currentQuestion.value,
				question: currentQuestion.question,
				image: currentQuestion.image || null
			});
		}

		function renderPlayerControls(qId) {
			let isUsed = false;
			modalControls.innerHTML = "";

			if(typeof usedQuestions[qId] === 'undefined') {
				usedQuestions[qId] = {};
			} else {
				isUsed = true;
			}

			players.forEach((player) => {
				const container = document.createElement("div");
				container.classList.add('player-controls');

				const spanName = document.createElement("span");
				spanName.textContent = player.name;
				container.appendChild(spanName);

				const spanScore = document.createElement("span");
				spanScore.style.margin = "0 10px";
				spanScore.textContent = player.score;
				container.appendChild(spanScore);

				const btnContainer = document.createElement("div");
				const btnCorrect = document.createElement("button");
				btnCorrect.textContent = "Правильно";
				btnCorrect.style.marginLeft = "10px";
				btnCorrect.onclick = function () {
					if (typeof usedQuestions[qId][player.id] === 'undefined') {
						updateScore(player.id, currentQuestion.value);
						spanScore.textContent = Number(spanScore.textContent) + Number(currentQuestion.value);
						spanScore.style.color = "green";
						
						usedQuestions[qId][player.id] = true;
						saveUsedQuestions();
						btnCorrect.disabled = true;
						btnWrong.disabled = true;
						btnCorrect.style.opacity = 0.5;
						btnWrong.style.opacity = 0.1;

						let unUsedBtnList = document.querySelectorAll('.player-controls button:not([disabled])');
						unUsedBtnList.forEach(btn => {
							btn.disabled = true;
							btn.style.opacity = 0.1;
						});
					}
				};

				const btnWrong = document.createElement("button");
				btnWrong.textContent = "Неправильно";
				btnWrong.style.marginLeft = "10px";
				btnWrong.onclick = function () {
					if (typeof usedQuestions[qId][player.id] === 'undefined') {
						updateScore(player.id, -currentQuestion.value);
						spanScore.textContent = Number(spanScore.textContent) - Number(currentQuestion.value);
						spanScore.style.color = "red";

						usedQuestions[qId][player.id] = false;
						saveUsedQuestions();
						btnCorrect.disabled = true;
						btnWrong.disabled = true;
						btnCorrect.style.opacity = 0.1;
						btnWrong.style.opacity = 0.5;
					}
				};

				if (isUsed) {
					spanScore.remove();
					btnCorrect.disabled = true;
					btnWrong.disabled = true;
					if(typeof usedQuestions[qId][player.id] === 'undefined') {
						btnCorrect.style.opacity = 0.1;
						btnWrong.style.opacity = 0.1;
					} else if(usedQuestions[qId][player.id]) {
						btnCorrect.style.opacity = 0.5;
						btnWrong.style.opacity = 0.1;
					} else {
						btnCorrect.style.opacity = 0.1;
						btnWrong.style.opacity = 0.5;
					}
				}

				btnContainer.appendChild(btnCorrect);
				btnContainer.appendChild(btnWrong);
				container.appendChild(btnContainer);
				modalControls.appendChild(container);
			});

			const closeBtn = document.createElement("button");
			closeBtn.textContent = "Закрыть вопрос";
			closeBtn.style.marginTop = "20px";
			closeBtn.style.padding = "10px 20px";
			closeBtn.onclick = function () { closeModal(); };
			modalControls.appendChild(closeBtn);
		}

		function showAnswer() {
			const correctAnswerEl = document.querySelector(".correctAnswer");
			correctAnswerEl.innerHTML = "Ответ: " + currentQuestion.answer;
			correctAnswerEl.style.display = "block";

			gameChannel.postMessage({
				action: 'showAnswer',
				answer: currentQuestion.answer
			});
		}

		function closeModal() {
			document.getElementById("videoContainer").innerHTML = "";
			const imgCont = document.getElementById("imageContainer");
			imgCont.innerHTML = "";
			imgCont.style.display = "none";
			document.getElementById("questionModal").classList.remove('open');

			gameChannel.postMessage({ 
				action: 'close',
				used: usedQuestions,
				players: players
			});
		}

		function addPlayer() {
			let name = prompt("Введите имя игрока:");
			if (name && name.trim()) {
				players.push({id: players.length+1, name: name.trim(), score: 0 });
				savePlayers();
				renderLeaderboard();
			}
		}

		function updateScore(playerId, points, fullUpdate) {
			const playerIndex = players.findIndex(item => item.id === playerId);
			if(fullUpdate) {
				players[playerIndex].score = Number(points);
			} else {
				players[playerIndex].score += Number(points);
			}
			savePlayers();
			renderLeaderboard();
		}

		function resetGame() {
			let reset = confirm("Сбросить игру?");
			if (reset) {
				localStorage.clear();
				if (db) {
					const tx = db.transaction(["gameData"], "readwrite");
					tx.objectStore("gameData").clear();
				}
				window.location.reload();
			}
		}

		function nextRound() {
			let nextR = currentRound + 1;
			if (nextR >= roundQuestion.length) nextR = 0;
			currentRound = nextR;
			localStorage.setItem("currentRound", currentRound);
			categories = roundQuestion[currentRound] || roundQuestion[0];
			initBoard();
			document.querySelector('.roundText').innerHTML = 'Раунд ' + (currentRound + 1);
		}

		function renderLeaderboard() {
			const list = document.getElementById("playersList");
			list.innerHTML = "";
			let sortPlayers = [...players].sort((a, b) => b.score - a.score);
			sortPlayers.forEach((player) => {
				const div = document.createElement("div");
				div.className = "player";
				
				const scoreSpan = document.createElement("span");
				scoreSpan.textContent = player.score;
				scoreSpan.style.cursor = "pointer";
				scoreSpan.onclick = function() { showEditField(player, scoreSpan); };

				div.innerHTML = '<span>' + player.name + '</span>';
				div.appendChild(scoreSpan);
				list.appendChild(div);
			});

			gameChannel.postMessage({
				action: 'updatePlayers',
				players: players
			});
		}

		function showEditField(player, scoreSpan) {
			const input = document.createElement("input");
			input.type = "number";
			input.value = player.score;
			input.style.width = "90px";
			input.onblur = function() { updateScore(player.id, input.value, true); };
			input.onkeydown = function(event) {
				if (event.key === "Enter") {
					updateScore(player.id, input.value, true);
				}
			};
			scoreSpan.replaceWith(input);
			input.focus();
		}

		window.onload = function () {
			// Восстанавливаем сохраненный пользовательский фон при загрузке
			let savedBg = localStorage.getItem("customBgUrl");
			if (savedBg) {
				document.body.style.backgroundImage = `url('${savedBg}')`;
			}
			renderLeaderboard();
		}
	</script>
</body>
</html>
