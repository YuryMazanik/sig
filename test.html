<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerJS P2P Мультиплеер</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 90%;
      max-width: 400px;
    }
    input, button {
      width: 100%;
      padding: 0.8rem;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #374151;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    .btn-target {
      background: #ef4444;
      font-size: 1.5rem;
      padding: 1.5rem;
    }
    .btn-target:hover { background: #dc2626; }
    .status { margin: 1rem 0; color: #a1a1aa; word-break: break-all; }
  </style>
  <!-- Подключаем библиотеку PeerJS через CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="card">
  <h2>P2P Дуэль 🔥</h2>
  <div id="status" class="status">Инициализация сети...</div>

  <!-- Меню подключения -->
  <div id="menu">
    <p>Ваш ID: <b id="myId">Генерация...</b></p>
    <hr style="border-color: #374151; margin: 1rem 0;">
    <input type="text" id="peerIdInput" placeholder="Введите ID друга">
    <button id="connectBtn">Подключиться к другу</button>
  </div>

  <!-- Игровая зона (скрыта до подключения) -->
  <div id="gameArea" style="display: none;">
    <p id="connectionStatus" style="color: #22c55e;">Соединение установлено!</p>
    <button id="actionBtn" class="btn-target" disabled>Ждите старта...</button>
    <div id="result" style="font-size: 1.25rem; margin-top: 1rem; font-weight: bold;"></div>
  </div>
</div>

<script>
  let peer;
  let conn;
  let isHost = false;

  const statusEl = document.getElementById('status');
  const myIdEl = document.getElementById('myId');
  const menuEl = document.getElementById('menu');
  const gameArea = document.getElementById('gameArea');
  const connectBtn = document.getElementById('connectBtn');
  const peerIdInput = document.getElementById('peerIdInput');
  const actionBtn = document.getElementById('actionBtn');
  const resultEl = document.getElementById('result');

  // 1. Создаем Peer (получаем случайный ID от публичного сервера PeerJS)
  peer = new Peer();

  peer.on('open', (id) => {
    myIdEl.innerText = id;
    statusEl.innerText = "Готов к подключению!";
  });

  peer.on('error', (err) => {
    statusEl.innerText = "Ошибка: " + err.type;
  });

  // 2. СЦЕНАРИЙ А: Вы — Игрок 2 (подключаетесь к Игроку 1)
  connectBtn.addEventListener('click', () => {
    const friendId = peerIdInput.value.trim();
    if (!friendId) return;

    statusEl.innerText = "Подключение...";
    conn = peer.connect(friendId);
    setupConnection();
  });

  // 3. СЦЕНАРИЙ Б: Вы — Игрок 1 (к вам кто-то подключился)
  peer.on('connection', (connection) => {
    conn = connection;
    isHost = true;
    setupConnection();
  });

  // Настройка обработчиков для уже установленного соединения
  function setupConnection() {
    conn.on('open', () => {
      menuEl.style.display = 'none';
      gameArea.style.display = 'block';
      statusEl.innerText = "В игре!";
      
      // Если мы хост, через 2 секунды дадим сигнал старта
      if (isHost) {
        setTimeout(startRound, 2000);
      } else {
        actionBtn.innerText = "Ожидание старта хоста...";
      }
    });

    // Получение данных от второго игрока
    conn.on('data', (data) => {
      if (data.type === 'START') {
        actionBtn.disabled = false;
        actionBtn.innerText = "ЖМИ СЕЙЧАС!";
        window.roundStartTime = performance.now();
      } 
      else if (data.type === 'CLICK') {
        // Если соперник нажал кнопку раньше
        actionBtn.disabled = true;
        resultEl.style.color = "#ef4444";
        resultEl.innerText = `Поберил соперник (${data.time.toFixed(0)} мс)!`;
      }
    });
  }

  // Хост дает старт раунда
  function startRound() {
    // Случайная задержка перед сигналом
    const delay = Math.random() * 2000 + 1000;
    setTimeout(() => {
      conn.send({ type: 'START' });
      actionBtn.disabled = false;
      actionBtn.innerText = "ЖМИ СЕЙЧАС!";
      window.roundStartTime = performance.now();
    }, delay);
  }

  // Нажатие на кнопку игроком
  actionBtn.addEventListener('click', () => {
    const reactionTime = performance.now() - window.roundStartTime;
    
    actionBtn.disabled = true;
    resultEl.style.color = "#22c55e";
    resultEl.innerText = `Вы победили! Время: ${reactionTime.toFixed(0)} мс`;

    // Отправляем информацию о победе сопернику
    conn.send({ type: 'CLICK', time: reactionTime });
  });
</script>

</body>
</html>
