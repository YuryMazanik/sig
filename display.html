<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Своя Игра - Экран Зрителей</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Righteous&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #060913;
            --secondary-bg: #12182b;
            --accent-gold: linear-gradient(180deg, #ffe066 0%, #d49a00 100%);
            --used-bg: #151926;
            --text-light: #ffffff;
            --border-radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at 50% 30%, #1a2542 0%, #060913 85%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-layout {
            display: flex;
            width: 100%;
            height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: auto;
            width: 100%;
        }

        .sidebar {
            width: 320px;
            background: rgba(18, 24, 43, 0.85);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 2px rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            max-height: 100%;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin: 0 0 15px;
            color: #ffcc00;
            font-family: 'Righteous', cursive;
            font-size: 22px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
            text-align: center;
            letter-spacing: 1px;
        }

        .player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(90deg, #1e2947 0%, #151d33 100%);
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 700;
            border-left: 4px solid #ffcc00;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .player span:last-child {
            font-family: 'Righteous', monospace;
            color: #ffcc00;
            font-size: 22px;
        }

        h1.roundTitle {
            font-family: 'Righteous', cursive;
            color: #ffcc00;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            margin: 0 0 15px 0;
            text-shadow: 0 0 4px rgb(0 0 0);
            text-align: center;
            letter-spacing: 2px;
        }

        .board-wrapper {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            padding-bottom: 10px;
        }

        .board {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(18, 24, 43, 0.75);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: max-content;
            backdrop-filter: blur(8px);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .cell {
            background: var(--accent-gold);
            color: #0b0f1a;
            font-family: 'Righteous', sans-serif;
            font-weight: bold;
            font-size: clamp(20px, 2.5vw, 28px);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: clamp(60px, 7vw, 80px);
            height: clamp(55px, 6.5vw, 75px);
            border-radius: 10px;
            box-shadow: 0 5px 0 #996f00, 0 8px 15px rgba(0,0,0,0.5);
            flex-shrink: 0;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        .cell.header {
            background: linear-gradient(180deg, #ffffff 0%, #c8d3f5 100%);
            width: clamp(200px, 25vw, 320px);
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 1.5vw, 18px);
            font-weight: 900;
            text-transform: uppercase;
            justify-content: flex-start;
            padding: 0 15px;
            color: #0d1322;
            height: clamp(55px, 6.5vw, 75px);
            box-shadow: 0 5px 0 #8493c4, 0 8px 15px rgba(0,0,0,0.4);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cell.used {
            background: var(--used-bg);
            color: #3b4461;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.7);
            text-shadow: none;
        }

        .question-view {
            display: none;
            width: 100%;
            text-align: center;
            max-width: 900px;
            animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .q-header {
            color: #ffcc00;
            font-family: 'Righteous', cursive;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            margin-bottom: 15px;
            text-shadow: 0 0 7px rgb(0 0 0);
        }

        .questionText {
            font-size: clamp(1.4rem, 3.5vw, 2.5rem);
            line-height: 1.4;
            margin: 15px 0;
            font-weight: 900;
            background: rgba(18, 24, 43, 0.9);
            padding: clamp(15px, 3vw, 30px);
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 204, 0, 0.2);
            color: #f0f4ff;
            word-break: break-word;
        }

        .image-container img {
            max-width: 100%;
            max-height: 40vh;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .correctAnswer {
            color: #ffffff;
            font-size: clamp(1.5rem, 3vw, 2.4rem);
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            margin-top: 20px;
            display: none;
            /* text-shadow: 0 0 20px rgba(0, 255, 170, 0.6); */
            background: rgb(5 181 3 / 88%);
            padding: 15px;
            border-radius: 14px;
            border: 2px solid rgba(0, 255, 170, 0.4);
            animation: fadeIn 0.3s ease-in-out;
            word-break: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            body { overflow-y: auto; }
            .main-layout {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                padding: 12px;
                gap: 15px;
            }
            .sidebar { width: 100%; order: 2; }
            .game-area { order: 1; justify-content: flex-start; }
            .board-wrapper { justify-content: flex-start; }
            .cell.header { width: 160px; font-size: 13px; padding: 0 10px; }
            .cell { width: 50px; height: 48px; font-size: 18px; border-radius: 6px; }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="game-area">
            <h1 class="roundTitle" id="roundTitle">СВОЯ ИГРА</h1>
            
            <div class="board-wrapper">
                <div class="board" id="tvBoard">
                    <div style="font-size: 1.4rem; color: #556080; margin: 30px 0; text-align: center;">Ожидание подключения ведущего...</div>
                </div>
            </div>

            <div class="question-view" id="questionView">
                <div class="q-header" id="qTitle"></div>
                <div class="image-container" id="qImageContainer"></div>
                <div class="questionText" id="qText"></div>
                <div class="correctAnswer" id="qAnswer"></div>
            </div>
        </div>

        <div class="sidebar">
            <h2>ТАБЛИЦА ЛИДЕРОВ</h2>
            <div id="tvPlayersList">
                <div style="color: #6677a3; text-align: center; margin-top: 15px; font-weight: bold;">Ожидание игроков...</div>
            </div>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('svoya_igra_channel');
        const tvBoard = document.getElementById('tvBoard');
        const questionView = document.getElementById('questionView');
        const qTitle = document.getElementById('qTitle');
        const qText = document.getElementById('qText');
        const qImageContainer = document.getElementById('qImageContainer');
        const qAnswer = document.getElementById('qAnswer');
        const roundTitleEl = document.getElementById('roundTitle');
        const tvPlayersList = document.getElementById('tvPlayersList');

        let currentPackageData = null;
        let currentRoundIdx = 0;
        let usedQuestionsState = {};

        // Применяем сохраненный фон при загрузке страницы телевизора
        function applyBackground() {
            let savedBg = localStorage.getItem("customBgUrl");
            if (savedBg) {
                document.body.style.backgroundImage = `url('${savedBg}')`;
            } else {
                document.body.style.backgroundImage = "none";
            }
        }

        applyBackground();

        channel.postMessage({ action: 'tvConnected' });

        channel.onmessage = function (event) {
            const data = event.data;

            if (data.action === 'updatePlayers') {
                renderTVPlayers(data.players);
            }

            if (data.action === 'initBoard') {
                currentPackageData = data.categories;
                currentRoundIdx = data.round;
                roundTitleEl.textContent = 'РАУНД ' + (currentRoundIdx + 1);
                usedQuestionsState = data.used || {};
                renderTVBoard();
                if (data.players) renderTVPlayers(data.players);
                applyBackground();
            }
            else if (data.action === 'showQuestion') {
                document.querySelector('.board-wrapper').style.display = 'none';
                qTitle.textContent = data.title + ' — ' + data.value + ' ОЧКОВ';
                qText.textContent = data.question;
                
                qAnswer.style.display = 'none';
                qAnswer.textContent = '';

                if (data.image) {
                    qImageContainer.innerHTML = '<img src="' + data.image + '" alt="Вопрос">';
                    qImageContainer.style.display = 'block';
                } else {
                    qImageContainer.innerHTML = '';
                    qImageContainer.style.display = 'none';
                }
                questionView.style.display = 'block';
            } 
            else if (data.action === 'showAnswer') {
                qAnswer.innerHTML = "ОТВЕТ: " + data.answer;
                qAnswer.style.display = 'block';
            }
            else if (data.action === 'close') {
                questionView.style.display = 'none';
                document.querySelector('.board-wrapper').style.display = 'flex';
                if (data.used) {
                    usedQuestionsState = data.used;
                    renderTVBoard();
                }
                if (data.players) {
                    renderTVPlayers(data.players);
                }
            }
        };

        function renderTVBoard() {
            tvBoard.innerHTML = '';
            if (!currentPackageData) return;

            currentPackageData.forEach((cat, catIndex) => {
                const row = document.createElement('div');
                row.className = 'row';

                const headerCell = document.createElement('div');
                headerCell.className = 'cell header';
                headerCell.textContent = cat.title;
                row.appendChild(headerCell);

                cat.questions.forEach((q, qIndex) => {
                    const qId = currentRoundIdx + '-' + catIndex + '-' + qIndex;
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = q.value;

                    if (usedQuestionsState && usedQuestionsState[qId]) {
                        cell.classList.add('used');
                    }
                    row.appendChild(cell);
                });
                tvBoard.appendChild(row);
            });
        }

        function renderTVPlayers(players) {
            tvPlayersList.innerHTML = '';
            if (!players || players.length === 0) {
                tvPlayersList.innerHTML = '<div style="color: #6677a3; text-align: center; margin-top: 15px; font-weight: bold;">Ожидание игроков...</div>';
                return;
            }
            let sorted = [...players].sort((a, b) => b.score - a.score);
            sorted.forEach(player => {
                const div = document.createElement('div');
                div.className = 'player';
                div.innerHTML = '<span>' + player.name + '</span><span>' + player.score + '</span>';
                tvPlayersList.appendChild(div);
            });
        }

        channel.postMessage({ action: 'requestSync' });
    </script>
</body>
</html>
